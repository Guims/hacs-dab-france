name: Vérification des radios
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
concurrency:
  group: radio-catalog
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les flux
        run: python3 scripts/build_catalog.py
      - name: Publier le catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/stations.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation du catalogue radio"
            git push
          fi
