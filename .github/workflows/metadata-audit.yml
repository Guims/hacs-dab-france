name: Metadata audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/metadata-audit.yml'
permissions:
  contents: read
concurrency:
  group: metadata-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install aiohttp
      - run: python -m py_compile scripts/audit_metadata.py
      - run: python scripts/audit_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: metadata-audit
          path: metadata-audit.json
